name: Validate skill

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer tests
        run: python -m unittest discover -s tests
      - name: Skill tests
        run: python -m unittest discover -s skills/farhat-unity-builder/tests
      - name: Chapter data
        run: python skills/farhat-unity-builder/scripts/validate_chapters.py
      - name: C# type-check against API stubs
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-mcs
          bash skills/farhat-unity-builder/tests/csharp-compile-check/check.sh
